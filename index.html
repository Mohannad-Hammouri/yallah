<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>يلا نتحرّك</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap">
<style>
/* Layout: one clean screen at a time. In a duel the arena is split: each player owns a colored half, the middle column holds only the task, timer and one control. The halves become the judge buttons. */
:root{
  --sky:#2F6BF0; --sky-deep:#1B45B5; --night:#141A3C;
  --sun:#FFD23F; --pink:#FF5C8A; --leaf:#1FC777;
  --ink:#1B1F3B; --paper:#FFFFFF; --soft:#EEF3FF; --muted:#5B6488; --mist:rgba(255,255,255,.72);
  --display:"Baloo Bhaijaan 2","Tajawal","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background-color:var(--sky); background-image:radial-gradient(rgba(255,255,255,.12) 2px,transparent 2.5px); background-size:34px 34px; color:var(--paper); font-family:var(--display); direction:rtl; overflow-x:hidden; transition:background-color .4s}
body.arena-mode{background-color:var(--night); background-image:radial-gradient(rgba(255,255,255,.06) 2px,transparent 2.5px)}
#app{min-height:100%; height:100%; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); padding-block:14px; box-sizing:border-box; display:flex; flex-direction:column}
section{flex:1; display:flex; flex-direction:column; gap:14px; min-height:0}
#setup,#end{overflow-y:auto}
h1,h2,h3{margin:0; line-height:1.1; text-wrap:balance}
button,input,select{font-family:inherit}
button{cursor:pointer}
:focus-visible{outline:4px solid var(--sun); outline-offset:3px}

.btn{border:0; border-radius:22px; padding:14px 30px; font-size:clamp(20px,2.6vw,30px); font-weight:800; color:var(--ink); background:var(--sun); box-shadow:0 7px 0 #C99A00; transition:transform .08s, box-shadow .08s; display:inline-flex; align-items:center; gap:10px; justify-content:center}
.btn:active{transform:translateY(5px); box-shadow:0 2px 0 #C99A00}
.btn.go{background:var(--leaf); color:var(--paper); box-shadow:0 7px 0 #0F8A50}
.btn.go:active{box-shadow:0 2px 0 #0F8A50}
.btn.pink{background:var(--pink); color:var(--paper); box-shadow:0 7px 0 #C2335E}
.btn.ghost{background:var(--soft); color:var(--sky-deep); box-shadow:0 7px 0 #C4D1F2}
.btn.dark{background:rgba(255,255,255,.14); color:var(--paper); box-shadow:0 7px 0 rgba(0,0,0,.35)}
.btn.small{font-size:18px; padding:10px 18px; border-radius:16px}
.btn.big{font-size:clamp(28px,4vw,44px); padding:18px 54px; border-radius:28px}

/* ---------- Setup ---------- */
.setup-wrap{max-width:820px; width:100%; margin:0 auto; display:flex; flex-direction:column; gap:18px; padding-bottom:8px}
.hero{text-align:center; padding-top:6px}
.logo{font-size:clamp(52px,10vw,104px); font-weight:800; color:var(--sun); text-shadow:0 6px 0 var(--sky-deep); line-height:1; transform:rotate(-2deg)}
.tag{font-size:clamp(17px,2.2vw,22px); font-weight:700; color:var(--mist); margin-top:8px}
.panel{background:var(--paper); color:var(--ink); border-radius:28px; padding:20px; box-shadow:0 10px 0 var(--sky-deep); display:flex; flex-direction:column; gap:12px}
.panel-head{display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap}
.panel h2{font-size:28px}
.count{font-size:17px; font-weight:800; color:var(--paper); background:var(--sky); padding:2px 14px; border-radius:999px}
.count.soft{background:var(--soft); color:var(--muted)}
.hint{font-size:15px; color:var(--muted); margin:0}

/* Player cards */
.players{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px}
.pcard{position:relative; display:flex; flex-direction:column; align-items:center; gap:8px; padding:14px 10px 12px; border-radius:24px; background:var(--soft)}
.avatar{width:104px; height:104px; border-radius:50%; border:0; background:var(--paper); box-shadow:0 0 0 6px var(--c), 0 6px 0 6px color-mix(in srgb, var(--c) 70%, #000); font-size:60px; line-height:1; display:grid; place-items:center; padding:0; overflow:hidden; transition:transform .12s}
.avatar:active{transform:scale(.94)}
.avatar .ph{width:100%; height:100%; box-shadow:none; border-radius:50%}
.cam{position:absolute; top:84px; inset-inline-start:calc(50% + 26px); width:42px; height:42px; border-radius:50%; border:3px solid var(--paper); background:var(--sun); font-size:20px; line-height:1; padding:0; box-shadow:0 3px 0 #C99A00}
.del{position:absolute; top:8px; inset-inline-end:8px; width:32px; height:32px; border-radius:50%; border:0; background:var(--paper); color:var(--muted); font-size:20px; font-weight:800; line-height:1; padding:0}
.del:hover{color:var(--pink)}
.pcard input{width:100%; box-sizing:border-box; text-align:center; font-size:22px; font-weight:800; padding:8px 10px; border-radius:14px; border:3px solid transparent; color:var(--ink); background:var(--paper); margin-top:8px}
.pcard input:focus{border-color:var(--c); outline:none}
.unphoto{border:0; background:none; color:var(--muted); font-size:14px; font-weight:700; text-decoration:underline; padding:0; margin-top:-4px}
.addcard{border:3px dashed #C4D1F2; background:transparent; border-radius:24px; color:var(--sky); font-size:20px; font-weight:800; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; min-height:120px}
.addcard b{font-size:56px; line-height:1}
.addcard:hover{background:var(--soft)}

/* Adults: compact chips */
.adults{display:flex; flex-wrap:wrap; gap:10px}
.achip{display:flex; align-items:center; gap:6px; background:var(--soft); border-radius:999px; padding:4px 6px 4px 8px}
.achip .emo{border:0; background:var(--paper); width:42px; height:42px; border-radius:50%; font-size:24px; padding:0}
.achip input{width:7.5em; font-size:19px; font-weight:800; border:0; background:transparent; color:var(--ink); padding:6px 2px}
.achip input:focus{outline:none; border-bottom:3px solid var(--sky)}
.achip .x{border:0; background:none; color:var(--muted); font-size:20px; font-weight:800; width:30px; height:30px; padding:0}
.addchip{border:3px dashed #C4D1F2; background:transparent; color:var(--sky); border-radius:999px; font-size:18px; font-weight:800; padding:8px 18px}

/* Settings (collapsed) */
.settings summary{list-style:none; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:24px; font-weight:800}
.settings summary::-webkit-details-marker{display:none}
.settings summary::after{content:"▾"; font-size:22px; color:var(--muted); transition:transform .2s}
.settings[open] summary::after{transform:rotate(180deg)}
.settings .sum{font-size:16px; color:var(--muted); font-weight:700; margin-inline-start:auto}
.set-body{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; padding-top:12px}
.toggles{display:flex; flex-direction:column; gap:10px}
.opt{display:flex; flex-direction:column; gap:6px; font-size:16px; color:var(--muted); font-weight:700}
.opt select{font-size:20px; padding:8px 12px; border-radius:14px; border:3px solid var(--soft); color:var(--ink); background:var(--paper)}
.toggle{display:flex; align-items:center; gap:10px; font-size:18px; color:var(--ink); font-weight:700}
.toggle input{width:24px; height:24px; accent-color:var(--leaf)}
.file{display:flex; flex-direction:column; gap:6px; font-size:16px; color:var(--ink); font-weight:700}
.file input{font-size:14px; max-width:100%; color:var(--muted)}

.ph{width:1em; height:1em; border-radius:50%; object-fit:cover; display:inline-block; vertical-align:middle; background:var(--soft); box-shadow:0 0 0 .04em rgba(255,255,255,.9)}
.side .members .ph,.chip .ph{width:1.15em; height:1.15em}
/* Camera booth */
.booth{position:fixed; inset:0; z-index:80; background:rgba(14,18,44,.92); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.booth h3{font-size:clamp(26px,3.6vw,40px); color:var(--paper); text-align:center}
.lens{position:relative; width:min(70vmin,420px); aspect-ratio:1; border-radius:50%; overflow:hidden; box-shadow:0 0 0 8px var(--c,var(--sun)), 0 0 60px rgba(0,0,0,.5); background:#000}
.lens video{width:100%; height:100%; object-fit:cover; transform:scaleX(-1)}
.lens .cd{position:absolute; inset:0; display:grid; place-items:center; font-size:clamp(90px,22vmin,170px); font-weight:800; color:var(--paper); text-shadow:0 6px 20px rgba(0,0,0,.6)}
.lens .flash{position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none}
.lens .flash.on{animation:flash .5s ease-out}
@keyframes flash{from{opacity:1}to{opacity:0}}
.booth .row{display:flex; gap:12px; flex-wrap:wrap; justify-content:center}
.booth .link{border:0; background:none; color:var(--mist); font-size:18px; font-weight:700; text-decoration:underline}

/* Sticky start */
.start-bar{position:sticky; bottom:0; display:flex; flex-direction:column; align-items:center; gap:8px; padding-block:14px 4px; background:linear-gradient(transparent, var(--sky) 40%); margin-top:-8px}
.err{color:var(--paper); background:var(--pink); border-radius:16px; padding:10px 16px; font-weight:800; font-size:18px; margin:0; text-align:center}

/* ---------- HUD ---------- */
.hud{display:flex; align-items:center; justify-content:space-between; gap:10px; position:relative; z-index:20}
.round{font-size:clamp(18px,2.2vw,26px); font-weight:800; background:rgba(255,255,255,.12); padding:4px 18px; border-radius:999px; color:var(--mist); min-height:1.4em}
.menu-btn{border:0; width:46px; height:46px; border-radius:14px; background:rgba(255,255,255,.12); color:var(--paper); font-size:24px; line-height:1}
.menu{position:absolute; top:54px; left:0; background:var(--paper); color:var(--ink); border-radius:20px; padding:8px; box-shadow:0 16px 40px rgba(0,0,0,.35); display:flex; flex-direction:column; min-width:220px}
.menu button{border:0; background:none; text-align:right; font-size:20px; font-weight:700; padding:10px 14px; border-radius:12px; color:var(--ink)}
.menu button:hover{background:var(--soft)}
#screen{flex:1; min-height:0; position:relative; display:flex; flex-direction:column}

/* ---------- Centered info screens ---------- */
.center{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:clamp(10px,2vh,22px); text-align:center; padding-block:10px}
.big-icon{font-size:clamp(90px,18vh,200px); line-height:1}
.title{font-size:clamp(34px,6vw,76px); font-weight:800; line-height:1.12; max-width:20ch; text-wrap:balance}
.lead{font-size:clamp(20px,2.8vw,32px); color:var(--mist); font-weight:700; max-width:30ch; text-wrap:balance}
.matchup{display:flex; align-items:center; gap:14px; flex-wrap:wrap; justify-content:center}
.pchip{display:inline-flex; align-items:center; gap:8px; background:var(--c); color:var(--paper); border-radius:999px; padding:4px 20px 4px 14px; font-size:clamp(20px,2.6vw,30px); font-weight:800}
.pchip .em{font-size:1.4em; line-height:1}
.vs-small{font-weight:800; color:var(--sun); font-size:clamp(20px,2.6vw,30px)}
.steps{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px; width:min(100%,680px)}
.steps li{display:flex; align-items:center; gap:16px; background:rgba(255,255,255,.1); border-radius:22px; padding:12px 18px; font-size:clamp(22px,3vw,36px); font-weight:800; text-align:right; animation:rise .5s both}
.steps li b{flex:none; width:1.7em; height:1.7em; border-radius:50%; background:var(--sun); color:var(--ink); display:grid; place-items:center; font-size:.85em}
@keyframes rise{from{transform:translateY(20px); opacity:0}}
.ready{animation:breathe 1.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.06)}}

/* ---------- Arena ---------- */
.arena{flex:1; min-height:0; display:grid; grid-template-columns:1fr minmax(240px,min(36vw,480px)) 1fr; grid-template-areas:"a mid b"; gap:clamp(10px,1.6vw,20px)}
.side{grid-area:a; background:var(--c); border-radius:36px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding:16px; position:relative; transition:opacity .3s, transform .3s, filter .3s, box-shadow .3s; box-shadow:inset 0 -12px 0 rgba(0,0,0,.18); border:0; color:var(--paper); font:inherit; min-width:0; cursor:default}
.side.b{grid-area:b}
.side .em{font-size:clamp(90px,20vh,220px); line-height:1; transition:transform .2s}
.side .nm{font-size:clamp(30px,4.6vw,64px); font-weight:800; overflow-wrap:anywhere; text-shadow:0 3px 0 rgba(0,0,0,.18)}
.side .members{display:flex; flex-wrap:wrap; gap:8px; justify-content:center}
.side .members span{background:rgba(255,255,255,.22); border-radius:999px; padding:2px 14px; font-size:clamp(18px,2.4vw,28px); font-weight:800}
.side.dim{opacity:.28; filter:grayscale(.7); transform:scale(.94)}
.side.on{box-shadow:inset 0 -12px 0 rgba(0,0,0,.18), 0 0 0 6px var(--sun), 0 0 60px rgba(255,210,63,.45)}
.side.on .em{animation:bounce .8s ease-in-out infinite}
@keyframes bounce{50%{transform:translateY(-14px)}}
.side.pick{cursor:pointer; animation:pickpulse 1.2s ease-in-out infinite}
.side.pick:hover{transform:scale(1.03)}
.side.pick::after{content:"👆 اكبس هون"; position:absolute; bottom:18px; font-size:clamp(18px,2.2vw,26px); font-weight:800; background:rgba(0,0,0,.22); padding:2px 16px; border-radius:999px}
@keyframes pickpulse{50%{box-shadow:inset 0 -12px 0 rgba(0,0,0,.18), 0 0 0 8px rgba(255,255,255,.75)}}
.side.win{box-shadow:inset 0 -12px 0 rgba(0,0,0,.18), 0 0 0 8px var(--sun)}
.side.in-r{animation:inR .6s cubic-bezier(.2,1.4,.5,1) both} .side.in-l{animation:inL .6s cubic-bezier(.2,1.4,.5,1) both}
@keyframes inR{from{transform:translateX(50vw)}} @keyframes inL{from{transform:translateX(-50vw)}}
.mid{grid-area:mid; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:clamp(10px,2vh,20px); text-align:center; min-width:0}
.mid .icon{font-size:clamp(64px,12vh,130px); line-height:1}
.mid .say{font-size:clamp(26px,3.6vw,48px); font-weight:800; line-height:1.15; text-wrap:balance}
.mid .note{font-size:clamp(18px,2.2vw,26px); color:var(--mist); font-weight:700; text-wrap:balance}
.vs-mark{font-size:clamp(64px,10vw,130px); font-weight:800; color:var(--sun); text-shadow:0 6px 0 rgba(0,0,0,.35); animation:slam .5s .45s cubic-bezier(.3,1.8,.5,1) both}
@keyframes slam{from{transform:scale(4); opacity:0}}
.controls{display:flex; flex-wrap:wrap; gap:12px; justify-content:center}

.timer{position:relative; width:clamp(120px,19vh,190px); height:clamp(120px,19vh,190px); flex:none}
.timer svg{width:100%; height:100%; transform:rotate(-90deg)}
.timer .track{stroke:rgba(255,255,255,.14)} .timer .bar{stroke:var(--leaf); transition:stroke .3s}
.timer.warn .bar{stroke:var(--sun)} .timer.hot .bar{stroke:var(--pink)}
.timer span{position:absolute; inset:0; display:grid; place-items:center; font-size:clamp(44px,7vh,72px); font-weight:800; font-variant-numeric:tabular-nums}
.timer.hot span{color:var(--pink); animation:thump .5s ease-in-out infinite}
@keyframes thump{50%{transform:scale(1.15)}}
.watch{font-size:clamp(64px,12vh,130px); font-weight:800; font-variant-numeric:tabular-nums; line-height:1; color:var(--sun)}
.beats{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}
.beat{font-size:clamp(46px,8vh,84px); line-height:1; padding:10px; border-radius:22px; background:rgba(255,255,255,.1); transition:transform .1s, background .1s}
.beat.on{background:var(--sun); transform:scale(1.25)}
.tie{border:3px solid rgba(255,255,255,.4); background:transparent; color:var(--paper); font-size:clamp(20px,2.4vw,28px); font-weight:800; padding:8px 26px; border-radius:999px}
.tie:hover{background:rgba(255,255,255,.12)}

.overlay{position:absolute; inset:0; z-index:15; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; border-radius:36px; text-align:center}
.overlay.count{background:rgba(20,26,60,.92); font-size:clamp(140px,34vh,320px); font-weight:800; color:var(--sun)}
.overlay.count b{animation:zoom .9s ease-out}
@keyframes zoom{from{transform:scale(2.2); opacity:0}30%{opacity:1}to{transform:scale(1)}}
.overlay.monster{background:#F04545}
.overlay.monster .em{font-size:clamp(130px,28vh,260px); line-height:1; animation:thump .4s infinite}
.overlay.monster b{font-size:clamp(44px,7vw,90px)}
#screen.shake{animation:shake .4s linear 3}
@keyframes shake{25%{transform:translateX(-10px) rotate(-1deg)}75%{transform:translateX(10px) rotate(1deg)}}

.side .tally{font-size:clamp(22px,3vw,38px); letter-spacing:2px; min-height:1.2em}
/* ---------- Result ---------- */
.winner{display:flex; flex-direction:column; align-items:center; gap:4px; background:var(--c); border-radius:40px; padding:18px 44px 24px; box-shadow:0 0 0 8px var(--sun), 0 0 80px rgba(255,210,63,.4); animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
.winner .em{font-size:clamp(90px,18vh,180px); line-height:1}
.winner .nm{font-size:clamp(34px,5vw,64px); font-weight:800}
@keyframes pop{from{transform:scale(.3)}}
.jars{display:flex; flex-wrap:wrap; gap:12px; justify-content:center}
.jar{border-radius:24px; padding:8px 16px 10px; min-width:110px; display:flex; flex-direction:column; align-items:center; background:rgba(255,255,255,.1); border:4px solid transparent}
.jar .em{font-size:36px; line-height:1.1}
.jar .nm{font-size:20px; font-weight:800}
.jar .st{font-size:24px; font-weight:800; font-variant-numeric:tabular-nums; color:var(--sun)}
.jar.got{border-color:var(--c)}
.jar.bump{animation:bump .4s}
@keyframes bump{50%{transform:scale(1.18)}}
.fly{position:fixed; z-index:50; font-size:56px; pointer-events:none; left:0; top:0}

.card{width:min(80%,400px); aspect-ratio:3/4; max-height:54vh; border-radius:32px; background:var(--pink); color:var(--paper); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:20px; box-shadow:0 12px 0 #C2335E; animation:flip .8s ease-out both; box-sizing:border-box}
.card .em{font-size:clamp(80px,14vh,140px); line-height:1}
.card b{font-size:clamp(30px,4.4vw,52px); text-wrap:balance}
@keyframes flip{from{transform:perspective(800px) rotateY(180deg) scale(.6)}}

.heroes{display:flex; gap:clamp(20px,4vw,50px); justify-content:center; flex-wrap:wrap; padding-top:30px}
.hero-card{display:flex; flex-direction:column; align-items:center; gap:6px; animation:pop .8s cubic-bezier(.3,1.6,.5,1) both}
.hero-pic{position:relative; width:clamp(160px,30vh,280px); aspect-ratio:1; border-radius:50%; background:var(--paper); box-shadow:0 0 0 10px var(--c), 0 0 0 18px var(--sun), 0 0 90px rgba(255,210,63,.6); display:grid; place-items:center; font-size:clamp(100px,19vh,180px); line-height:1}
.hero-pic .ph{width:100%; height:100%; box-shadow:none}
.hero-pic .crown-top{position:absolute; top:-0.62em; left:50%; transform:translateX(-50%) rotate(-12deg); font-size:clamp(70px,12vh,120px); filter:drop-shadow(0 6px 6px rgba(0,0,0,.3)); animation:crownIn 1s .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes crownIn{from{transform:translate(-50%,-120px) rotate(-40deg); opacity:0}}
.hero-name{font-size:clamp(34px,5.5vw,70px); font-weight:800; color:var(--paper); text-shadow:0 5px 0 var(--sky-deep); margin-top:10px}
.hero-sub{font-size:clamp(20px,2.6vw,30px); font-weight:800; color:var(--sun)}
.end-title{font-size:clamp(44px,8vw,90px); font-weight:800; color:var(--sun); text-align:center; text-shadow:0 6px 0 var(--sky-deep)}
.crowns{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; max-width:1100px; width:100%; margin:0 auto}
.crown{background:var(--paper); color:var(--ink); border-radius:28px; padding:20px; box-shadow:0 10px 0 var(--sky-deep); display:flex; flex-direction:column; align-items:center; gap:4px; text-align:center; animation:pop .6s cubic-bezier(.3,1.6,.5,1) both; border-top:10px solid var(--c)}
.crown .c{font-size:44px} .crown .em{font-size:64px; line-height:1}
.crown .nm{font-size:30px; font-weight:800}
.crown .ttl{font-size:22px; font-weight:800; color:var(--pink)}

const TEAM_TASKS = [

  {kind:'relay', i:'🏃', t:'سباق التتابع!', do:'كل واحد بدوره بيركض لعند الحيط ورجاع وبيضرب كفّ للي بعده'},

const RHYTHM = [{e:'👏',f:900},{e:'🦶',f:150},{e:'🙌',f:600}];
const TITLES = ['⭐ نجم اللعبة','⚡ الصاروخ','💪 البطل القوي','😂 ملك الضحك','💃 أحلى رقّاص','🦁 الأسد الشجاع','🌈 قلب الفريق','🎉 نجم الحفلة'];
const DUEL_TITLE = {touch:'👆 أسرع إيد',updown:'🚀 ملك النطّ والقعدة',carry:'🎒 ملك التوازن',memory:'👀 عيون الصقر',robot:'🤖 أحلى روبوت',monster:'👹 أخوف وحش',face:'🤪 أضحك وجه',turtle:'🐢 أبطأ سلحفاة',freeze:'🗿 أحلى تمثال',rhythm:'🥁 ملك الإيقاع',jump:'🐸 ملك النطّ',frog:'🐸 أبعد نطّة',voice:'🗣️ أطول صوت',flam:'🦩 ملك التوازن',serious:'😐 أجدّ واحد',dizzy:'😵 ما بيدوخ',clap:'👏 ملك التصفيق',squat:'💪 البطل القوي'};

/* ---------- State ---------- */
let kids=[], adults=[], G=null, run=0;
let voiceOn=true, sfxOn=true, monsterOn=true, muted=false;
let songURL=null;
const music=new Audio('song.mp3'); music.loop=true; music.preload='auto';
let musicOK=true; music.addEventListener('error',()=>{ musicOK=false; });
const LV={high:1, low:.6, dance:1};
let mLevel='off', speaking=false, fadeIv=null;
function targetVol(){ if(muted||mLevel==='off') return 0; return speaking? LV[mLevel]*.7 : LV[mLevel]; }
function applyVol(fast){ clearInterval(fadeIv); const t=targetVol(); if(fast){ music.volume=t; return; }
  fadeIv=setInterval(()=>{ const d=t-music.volume; if(Math.abs(d)<.04){ music.volume=t; clearInterval(fadeIv); } else music.volume=Math.max(0,Math.min(1,music.volume+Math.sign(d)*.04)); },40); }
function setMusic(l,fast){ mLevel=l; if(!musicOK) return;
  if(l==='off'){ applyVol(true); music.pause(); return; }
  if(music.paused&&!muted){ if(fast) music.volume=targetVol(); music.play().catch(()=>{}); }
  applyVol(fast); }
/* Lobby song: setup + how-to-play screens. Browsers allow sound only after a tap, so it starts on the first tap. */
let lobbyURL=null;
const lobby=new Audio('lobby.mp3'); lobby.loop=true; lobby.preload='auto';
let lobbyOn=false, lobbyFade=null;
function lobbyStart(){ if(lobbyOn) return; lobbyOn=true; clearInterval(lobbyFade); if(muted) return;
  lobby.volume=0; lobby.play().catch(()=>{ lobbyOn=false; });
  lobbyFade=setInterval(()=>{ lobby.volume=Math.min(.75,lobby.volume+.05); if(lobby.volume>=.75) clearInterval(lobbyFade); },60); }
function lobbyStop(){ lobbyOn=false; clearInterval(lobbyFade);
  lobbyFade=setInterval(()=>{ lobby.volume=Math.max(0,lobby.volume-.06); if(lobby.volume<=0){ clearInterval(lobbyFade); lobby.pause(); } },50); }
document.addEventListener('pointerdown',()=>{ if(!$('#setup').hidden) lobbyStart(); });
document.addEventListener('keydown',()=>{ if(!$('#setup').hidden) lobbyStart(); });
const av=p=>p.photo?`<img class="ph" src="${p.photo}" alt="">`:p.emoji;
class Quit extends Error {}
const alive = id => { if(id!==run) throw new Quit(); };

/* ---------- Storage ---------- */
function load(){
  try{ const s=JSON.parse(localStorage.getItem('ynt2')||'null'); if(s&&Array.isArray(s.kids)) return s; }catch(e){}
  return {kids:[{name:'سارة',emoji:'🦁'},{name:'عمر',emoji:'🐰'},{name:'ليلى',emoji:'🐸'},{name:'آدم',emoji:'🐻'}], adults:[{name:'بابا',emoji:'🧔'},{name:'ماما',emoji:'👩'}]};
}
function save(){ const d={kids:kids.map(k=>({name:k.name,emoji:k.emoji,photo:k.photo||null})), adults:adults.map(k=>({name:k.name,emoji:k.emoji}))};
  try{ localStorage.setItem('ynt2', JSON.stringify(d)); }catch(e){ try{ d.kids.forEach(k=>k.photo=null); localStorage.setItem('ynt2', JSON.stringify(d)); }catch(e2){} } }

/* ---------- Setup ---------- */
function renderKids(){
  const el=$('#kidList'); el.innerHTML='';
  kids.forEach((k,idx)=>{
    const c=COLORS[idx%COLORS.length];
    const card=document.createElement('div'); card.className='pcard'; card.style.setProperty('--c',c);
    const avb=document.createElement('button'); avb.className='avatar'; avb.innerHTML=av(k); avb.setAttribute('aria-label',k.photo?'صوّر من جديد':'غيّر الحيوان');
    avb.onclick=()=>{ if(k.photo){ openCam(k); return; } k.emoji=EMOJIS[(EMOJIS.indexOf(k.emoji)+1)%EMOJIS.length]; avb.textContent=k.emoji; save(); };
    const cam=document.createElement('button'); cam.className='cam'; cam.textContent='📷'; cam.setAttribute('aria-label','صوّر'); cam.onclick=()=>openCam(k);
    const del=document.createElement('button'); del.className='del'; del.textContent='×'; del.setAttribute('aria-label','احذف '+(k.name||'الطفل'));
    del.onclick=()=>{ kids.splice(idx,1); save(); renderSetup(); };
    const inp=document.createElement('input'); inp.id='kid-'+idx; inp.value=k.name; inp.placeholder='الاسم'; inp.maxLength=12;
    inp.oninput=()=>{ k.name=inp.value; save(); updateCount(); };
    card.append(del,avb,cam,inp);
    if(k.photo){ const u=document.createElement('button'); u.className='unphoto'; u.textContent='🐾 رجّع الحيوان'; u.onclick=()=>{ k.photo=null; save(); renderSetup(); }; card.append(u); }
    el.append(card);
  });
  const add=document.createElement('button'); add.className='addcard'; add.innerHTML='<b>+</b>طفل كمان'; add.id='addKid';
  add.onclick=()=>addTo(kids,EMOJIS,'kid-'); el.append(add);
  updateCount();
}
function renderAdults(){
  const el=$('#adultList'); el.innerHTML='';
  adults.forEach((k,idx)=>{
    const ch=document.createElement('div'); ch.className='achip';
    const e=document.createElement('button'); e.className='emo'; e.textContent=k.emoji; e.setAttribute('aria-label','غيّر الشكل');
    e.onclick=()=>{ k.emoji=ADULT_EMOJIS[(ADULT_EMOJIS.indexOf(k.emoji)+1)%ADULT_EMOJIS.length]; e.textContent=k.emoji; save(); };
    const inp=document.createElement('input'); inp.id='adult-'+idx; inp.value=k.name; inp.placeholder='مثلاً: بابا'; inp.maxLength=12;
    inp.oninput=()=>{ k.name=inp.value; save(); };
    const x=document.createElement('button'); x.className='x'; x.textContent='×'; x.setAttribute('aria-label','احذف');
    x.onclick=()=>{ adults.splice(idx,1); save(); renderSetup(); };
    ch.append(e,inp,x); el.append(ch);
  });
  const add=document.createElement('button'); add.className='addchip'; add.textContent='+ كبير'; add.onclick=()=>addTo(adults,ADULT_EMOJIS,'adult-'); el.append(add);
}

// Center-crops the picture to a square so the circle is always fully covered
async function toSquare(file){
  let img;
  try{ img=await createImageBitmap(file,{imageOrientation:'from-image'}); }
  catch(e){ img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file); }); }
  const w=img.width, h=img.height, side=Math.min(w,h), S=320;
  const c=document.createElement('canvas'); c.width=S; c.height=S; const g=c.getContext('2d');

}

/* ---------- Audio ---------- */
let ac=null;
function ctx(){ if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } } if(ac.state==='suspended') ac.resume(); return ac; }
function tone(f,d,type='sine',vol=.2,when=0,slideTo=null){
  if(!sfxOn||muted) return; const c=ctx(); if(!c) return;
  const o=c.createOscillator(), g=c.createGain(), t=c.currentTime+when;
  o.type=type; o.frequency.setValueAtTime(f,t); if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t+d);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t+d+.02);
}
const SFX={
  tick:()=>tone(1000,.05,'square',.07), spin:()=>tone(420,.06,'triangle',.18),
  ting:()=>{ tone(1320,.18,'triangle',.22); tone(1760,.3,'triangle',.22,.09); },
  beep:()=>tone(660,.22,'square',.14), go:()=>{ tone(880,.15,'square',.16); tone(1320,.4,'square',.16,.12); },
  buzz:()=>tone(240,.5,'sawtooth',.14,0,120),
  fanfare:()=>[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.28,'triangle',.2,i*.13)),
  whoosh:()=>tone(300,.35,'sine',.15,0,1200),
  vs:()=>{ tone(110,.6,'sawtooth',.2,0,55); tone(220,.5,'square',.12,.45,110); tone(880,.3,'square',.12,.5); },
  roar:()=>{ tone(90,.9,'sawtooth',.25,0,50); tone(140,.8,'square',.12,.05,70); },
  drum:()=>tone(160,.08,'triangle',.25,0,60)
};
const Beat={ timer:null,next:0,step:0,bpm:118,on:false,
  start(){ if(this.on) return; this.on=true;
    if(musicOK) return;
    const c=ctx(); if(!c){ this.on=false; return; } this.next=c.currentTime+.05; this.step=0; this.timer=setInterval(()=>this.tick(),25); },
  tick(){ const c=ac, spb=60/this.bpm/2; while(this.next<c.currentTime+.12){ this.play(this.step,this.next-c.currentTime); this.next+=spb; this.step=(this.step+1)%16; } },
  play(s,w){ if(!sfxOn||muted) return; w=Math.max(0,w);
    if(s%4===0) tone(150,.18,'sine',.32,w,45); if(s%8===4) tone(1800,.07,'square',.04,w);
    if(s%2===1) tone(5200,.03,'square',.025,w); if(s%2===0) tone([131,131,196,220][Math.floor(s/4)],.16,'triangle',.12,w); },
  fast(f){ this.bpm=f?150:118; },
  stop(){ this.on=false; clearInterval(this.timer); this.timer=null; this.bpm=118; }
};
function duck(d){ speaking=d; applyVol(); }

/* ---------- Speech: picks the clearest Arabic voice the device has ---------- */
let VOICE=null;
function pickVoice(){
  try{ const vs=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().startsWith('ar'));
    const score=v=>{ const n=(v.name||'').toLowerCase(); let s=0; if(/natural|online|neural/.test(n)) s+=10; if(v.lang.toLowerCase()==='ar-jo') s+=4; if(/google/.test(n)) s+=3; return s; };
    VOICE=vs.sort((a,b)=>score(b)-score(a))[0]||null; }catch(e){ VOICE=null; }
}
if('speechSynthesis' in window){ try{ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }catch(e){} }
function speak(text){
  if(!voiceOn||muted||!('speechSynthesis' in window)) return Promise.resolve();
  const clean=String(text).replace(/[\u{1F300}-\u{1FAFF}☀-➿⭐⭕️«»]/gu,'').trim();
  if(!clean) return Promise.resolve();
  return new Promise(res=>{ let done=false; const fin=()=>{ if(done) return; done=true; duck(false); res(); };
    try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(clean); u.lang=VOICE?VOICE.lang:'ar-SA'; if(VOICE) u.voice=VOICE;
      u.rate=VOICE&&/natural|online|neural/i.test(VOICE.name)?1.05:.95; u.pitch=1.1;
      u.onend=fin; u.onerror=fin; duck(true); speechSynthesis.speak(u); setTimeout(fin,1500+clean.length*110);
    }catch(e){ fin(); } });
}

/* ---------- Timers ---------- */
function timerHTML(secs){ return `<div class="timer" id="timer"><svg viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="52" fill="none" stroke-width="12"/><circle class="bar" id="tbar" cx="60" cy="60" r="52" fill="none" stroke-width="12" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="0"/></svg><span id="tnum">${toAr(secs)}</span></div>`; }
function countdownTimer(secs, id, {monster=false, doneBtn=null}={}){
  return new Promise((res,rej)=>{
    const C=326.7; let left=secs*1000, last=performance.now(), lastSec=secs, paused=false, finished=false;
    const monAt = monster ? secs*1000*(.35+Math.random()*.3) : -1; let monDone=false;
    Beat.start(); Beat.fast(false);
    const finish=how=>{ if(finished) return; finished=true; clearInterval(iv); Beat.stop(); res(how); };
    if(doneBtn&&$('#ctrl')){ $('#ctrl').innerHTML=`<button class="btn dark small" id="earlyBtn">${doneBtn}</button>`; $('#earlyBtn').onclick=()=>finish('early'); }
    const iv=setInterval(async ()=>{
      if(id!==run){ clearInterval(iv); Beat.stop(); rej(new Quit()); return; }
      const now=performance.now(), dt=now-last; last=now; if(paused) return;
      left-=dt;
      if(monAt>0&&!monDone&&secs*1000-left>=monAt){ monDone=true; paused=true; Beat.stop();
        try{ await monsterEvent(id); }catch(e){ clearInterval(iv); rej(e); return; }
        if(finished) return; last=performance.now(); paused=false; Beat.start(); }
      const l=Math.max(0,left/1000), s=Math.ceil(l);
      const bar=$('#tbar'), num=$('#tnum'), tm=$('#timer'); if(!bar){ if(!paused) finish('gone'); return; }
      bar.setAttribute('stroke-dashoffset', String(C*(1-l/secs)));
      if(s!==lastSec){ lastSec=s; num.textContent=toAr(s); if(s<=5&&s>0){ SFX.tick(); Beat.fast(true); } }
      tm.classList.toggle('warn',l<=secs/2&&l>5); tm.classList.toggle('hot',l<=5&&l>0);
      if(l<=0){ num.textContent='⏰'; tm.classList.remove('hot'); SFX.buzz(); finish('time'); }
    },100);
  });
}
function stopwatch(id, el){
  const t0=performance.now(); Beat.start();
  const iv=setInterval(()=>{ if(id!==run){ clearInterval(iv); Beat.stop(); return; } const w=$(el); if(w) w.textContent=toAr(((performance.now()-t0)/1000).toFixed(1)); },100);
  return ()=>{ clearInterval(iv); Beat.stop(); return (performance.now()-t0)/1000; };
}

/* ---------- Game ---------- */
const P = i => ({name:kids[i].name, emoji:kids[i].emoji, photo:kids[i].photo||null, c:kids[i].c, i});
const key=(a,b)=>a<b?a+'-'+b:b+'-'+a;
function pickPair(){
  const idx=kids.map((k,i)=>i), min=Math.min(...kids.map(k=>k.turns));
  const a=rnd(idx.filter(i=>kids[i].turns===min));
  const b=shuffle(idx.filter(i=>i!==a)).sort((x,y)=>(kids[x].turns-kids[y].turns)||((G.pairs[key(a,x)]||0)-(G.pairs[key(a,y)]||0)))[0];
  G.pairs[key(a,b)]=(G.pairs[key(a,b)]||0)+1; kids[a].turns++; kids[b].turns++;
  return Math.random()<.5?[a,b]:[b,a];
}
function pickDuel(){ if(!G.duelPool.length) G.duelPool=shuffle(DUELS); let d=G.duelPool.pop(); if(d.id===G.lastDuel&&G.duelPool.length){ const n=G.duelPool.pop(); G.duelPool.unshift(d); d=n; } G.lastDuel=d.id; return d; }
function pickTeamTask(){ if(!G.teamPool.length) G.teamPool=shuffle(TEAM_TASKS); return G.teamPool.pop(); }

async function loop(id){
  while(G.round<G.total){
    alive(id);
    if(G.round>=2&&G.round<G.total-1&&!G.double&&Math.random()<.3){
      const opts=['double']; if(adults.length>=2&&!G.adultsUsed) opts.push('adults','adults');
      const c=rnd(opts); await surprise(c,id);
      if(c==='adults'){ G.adultsUsed=true; await adultsDuel(id); continue; }
    }
    G.round++; setRound(`الجولة ${toAr(G.round)} من ${toAr(G.total)}`);
    const mult=G.double?2:1; G.double=false;
    if(G.schedule[G.round-1]==='team') await teamRound(id,mult); else await duelRound(id,mult);
  }
  endGame(id);
}

async function duelRound(id,mult){

async function playDuel(D,A,B,id){
  setMusic('low');

    }
    case 'seqFree': {
      arena(A,B,'');
      for(const [p,s] of [[A,'a'],[B,'b']]){
        setMid(`<div class="icon">${D.i}</div><div class="say">دور ${esc(p.name)}!</div><div class="note">${D.go}</div><div class="controls" id="ctrl"></div>`);
        sides(s==='a'?{a:'on',b:'dim'}:{a:'dim',b:'on'}); speak('دور '+p.name+'! '+D.go);
        await choose([{k:'ok',cls:'go',html:'✓ نطّ'}], id);
      }

    }
    case 'seqWatch': {
      arena(A,B,''); const times=[];
      for(const [p,s] of [[A,'a'],[B,'b']]){
        setMid(turnMid(p)); sides(s==='a'?{a:'on',b:'dim'}:{a:'dim',b:'on'}); speak('دور '+p.name+'. خذ نفس كبير');
        await ready(p); await count321(id);
        setMid(`<div class="icon">${D.i}</div><div class="say">${D.go}</div><div class="watch" id="watch">٠٫٠</div><div class="controls" id="ctrl"></div>`);
        const stop=stopwatch(id,'#watch');
        try{ await choose([{k:'s',cls:'pink',html:'✋ وقف!'}], id); } finally { times.push(stop()); }
        SFX.ting(); await sleep(600); alive(id);
      }
      const w=Math.abs(times[0]-times[1])<.15?'tie':(times[0]>times[1]?'a':'b');
      sides({a:w==='a'?'win':(w==='b'?'dim':''), b:w==='b'?'win':(w==='a'?'dim':'')});
      setMid(`<div class="icon">⏱️</div><div class="say">${esc(A.name)}: ${toAr(times[0].toFixed(1))} ثانية</div><div class="say">${esc(B.name)}: ${toAr(times[1].toFixed(1))} ثانية</div>`);
      await sleep(2200); alive(id); return w;
    }
    case 'togetherTimer': {

      await count321(id); if(mons) G.monsterCount++;

    }
    case 'memory': {
      arena(A,B,''); sides({a:'on',b:'on'});
      return quickfire(A,B,id,3, async r=>{
        const n=3+r, set=shuffle(ANIMALS).slice(0,n), gone=Math.floor(Math.random()*n);
        const grid=list=>`<div class="beats">${list.map(e=>`<div class="beat">${e}</div>`).join('')}</div>`;
        setMid(`<div class="say">طّلعوا منيح!</div>${grid(set)}`); speak('طّلعوا منيح!'); await sleep(3500+r*800); alive(id);
        setMid(`<div class="icon">🙈</div><div class="say">غمّضوا!</div>`); SFX.drum(); speak('غمّضوا!'); await sleep(2200); alive(id);
        setMid(`<div class="say">مين اختفى؟</div>${grid(set.map((e,i)=>i===gone?'❓':e))}`); SFX.go(); speak('فتّحوا! مين اختفى؟');
        return set[gone];
      }, 'مين عرف أول؟');
    }
    case 'rhythm': {
      arena(A,B,''); let len=3; setMusic('low');
      while(true){
        const pat=Array.from({length:len},()=>rnd(RHYTHM));
        sides({}); setMid(`<div class="say">اسمعوا وطّلعوا!</div><div class="beats">${pat.map((p,i)=>`<div class="beat" id="bt${i}">${p.e}</div>`).join('')}</div><div class="note">👏 صفقة · 🦶 دبكة · 🙌 إيدين لفوق</div><div class="controls" id="ctrl"></div>`);
        setMusic('off',true); await sleep(600); alive(id);
        for(let rep=0;rep<2;rep++){ for(let i=0;i<pat.length;i++){ const el=$('#bt'+i); el&&el.classList.add('on'); tone(pat[i].f,.18,pat[i].f<200?'sine':'triangle',.3); await sleep(520); alive(id); el&&el.classList.remove('on'); } await sleep(500); alive(id); }
        for(const [p,s] of [[A,'a'],[B,'b']]){
          setMusic('off',true); sides(s==='a'?{a:'on',b:'dim'}:{a:'dim',b:'on'}); $('#mid .say').textContent=`دور ${p.name}: عيدها!`; speak('دور '+p.name);
          await choose([{k:'ok',cls:'go',html:'✓ خلص'}], id);
        }
        sides({}); setMusic('low');
        const k=await choose([{k:'more',cls:'pink',html:'🔥 أصعب!'},{k:'judge',cls:'go',html:'🏁 احكموا'}], id);
        if(k==='judge') break; len=Math.min(len+2,7);
      }
      return pickSide(id,{note:'مين عاد الإيقاع صح؟ اكبسوا عليه'});
    }
  }
}

/* Quick-fire: several short points, the parent taps whoever got each one first. Returns 'a' | 'b' | 'tie' */
async function quickfire(A,B,id,rounds,showRound,label){
  const sc={a:0,b:0}; const a=$('.side.a'), b=$('.side.b');
  const tally=()=>{ for(const [el,k] of [[a,'a'],[b,'b']]){ let t=el.querySelector('.tally'); if(!t){ t=document.createElement('div'); t.className='tally'; el.append(t); } t.textContent='⭐'.repeat(sc[k])||'·'; } };
  tally();
  for(let r=0;r<rounds;r++){
    const reveal=await showRound(r); alive(id);
    $('#mid').insertAdjacentHTML('beforeend',`<div class="note">${label}</div><div class="controls"><button class="tie" data-k="tie">🤝 مع بعض</button></div>`);
    [a,b].forEach(s=>{ s.classList.add('pick'); s.tabIndex=0; });
    const k=await new Promise((res,rej)=>{ a.onclick=()=>res('a'); b.onclick=()=>res('b');
      $('#mid [data-k="tie"]').onclick=()=>res('tie');
      const iv=setInterval(()=>{ if(id!==run){ clearInterval(iv); rej(new Quit()); } else if(!document.body.contains(a)) clearInterval(iv); },200); });
    [a,b].forEach(s=>{ s.classList.remove('pick'); s.onclick=null; s.tabIndex=-1; });
    if(k==='tie'){ sc.a++; sc.b++; } else sc[k]++;
    tally(); SFX.ting();
    if(reveal){ setMid(`<div class="icon pulse">${reveal}</div><div class="say">هاد اللي اختفى!</div>`); await sleep(1600); alive(id); }
    else await sleep(500);
  }
  return sc.a===sc.b?'tie':(sc.a>sc.b?'a':'b');
}
const BODY=[{e:'👃',t:'أنفك'},{e:'👂',t:'إذنك'},{e:'🦶',t:'رجلك'},{e:'🤚',t:'إيدك'},{e:'👄',t:'تمّك'},{e:'👀',t:'عيونك'},{e:'🦵',t:'ركبتك'},{e:'🫃',t:'بطنك'},{e:'💆',t:'راسك'},{e:'💪',t:'كتفك'}];
const ANIMALS=['🐶','🐱','🐰','🦁','🐸','🐵','🐘','🦒','🐧','🐢','🐔','🐟','🦋','🐮'];

/* Result: winner card, then stars fly into the scoreboard */
function jarsHTML(){ return `<div class="jars">${kids.map((k,i)=>`<div class="jar" id="jar-${i}" style="--c:${k.c}"><div class="em">${av(k)}</div><div class="nm">${esc(k.name)}</div><div class="st">⭐ ${toAr(k.stars)}</div></div>`).join('')}</div>`; }
function updateJar(i){ const d=$('#jar-'+i); if(!d) return; d.querySelector('.st').textContent='⭐ '+toAr(kids[i].stars); d.classList.remove('bump'); void d.offsetWidth; d.classList.add('bump','got'); }
function flyStar(i,delay){ return new Promise(res=>{ setTimeout(()=>{
  const jar=$('#jar-'+i), from=$('#burst'); if(!jar||!from){ res(); return; }
  const a=from.getBoundingClientRect(), b=jar.getBoundingClientRect();
  const s=document.createElement('span'); s.className='fly'; s.textContent='⭐'; document.body.append(s);
  const x0=a.left+a.width/2-28, y0=a.top+a.height/2-28, x1=b.left+b.width/2-28, y1=b.top+b.height/2-28;
  SFX.whoosh();
  const an=s.animate([{transform:`translate(${x0}px,${y0}px) scale(.4)`},{transform:`translate(${(x0+x1)/2}px,${Math.min(y0,y1)-100}px) scale(1.6)`,offset:.45},{transform:`translate(${x1}px,${y1}px) scale(.8)`}],{duration:800,easing:'ease-in-out'});
  an.onfinish=()=>{ s.remove(); SFX.ting(); res(); };
}, delay); }); }
async function giveStars(list,id){ let delay=0; const fl=[];
  for(const [i,n] of list){ for(let r=0;r<n;r++){ fl.push(flyStar(i,delay).then(()=>{ kids[i].stars++; updateJar(i); })); delay+=220; } }
  await Promise.all(fl); alive(id); }

async function result(res,A,B,id,{mult=1,D=null,stars=null,headline=null,note=null,next=null,showWinner=true}={}){
  const W = res==='a'?A:res==='b'?B:null, L = res==='a'?B:res==='b'?A:null;
  const msg = headline || (W ? `برافو ${W.name}!` : 'تعادل! الاتنين أبطال!');
  const sub = note || (W ? `و${L.name} بياخد ⭐ نجمة الشجاعة` : 'كل واحد بياخد ⭐⭐');
  screen(`<div class="center">
    ${W&&showWinner?`<div class="winner" id="burst" style="--c:${W.c}"><div class="em">${av(W)}</div><div class="nm">🏆 ${esc(W.name)}</div></div>`
       :`<div class="big-icon" id="burst">${W?'🏆':'🤝'}</div>`}
    <div class="title" style="font-size:clamp(30px,4.6vw,58px)">${esc(msg)}</div>
    <div class="lead">${esc(sub)}</div>

    <div class="controls" id="ctrl"></div></div>`);
  setMusic('high'); SFX.fanfare(); confetti(40); speak(msg+'. '+sub);
  if(!stars){ stars=[];
    if(!W){ stars.push([A.i,2*mult],[B.i,2*mult]); }
    else { stars.push([W.i,2*mult],[L.i,1*mult]); kids[W.i].wins++; if(D) kids[W.i].byDuel[D.id]=(kids[W.i].byDuel[D.id]||0)+1; }
  }
  await sleep(900); alive(id);

  await choose([{k:'n',cls:'go big',html:next||(G.round>=G.total?'🏆 النتيجة!':'الجولة الجاية ▶')}], id);

/* ---------- Team round ---------- */
async function teamRound(id,mult){
  const order=shuffle(kids.map((k,i)=>i)), half=Math.ceil(order.length/2);
  const red=order.slice(0,half), blue=order.slice(half);
  const R={...TEAM.red}, Bl={...TEAM.blue};
  setMusic('high'); arena(R,Bl,`<div class="say">🔴 فريق ضد فريق 🔵</div><div class="note">القرعة!</div>`,true);
  speak('فريق ضد فريق! القرعة!'); await sleep(1200); alive(id);
  for(let n=0;n<order.length;n++){ const i=order[n], isRed=n<half;
    const box=$(isRed?'.side.a':'.side.b'); let mem=box.querySelector('.members'); if(!mem){ mem=document.createElement('div'); mem.className='members'; box.append(mem); }
    const c=document.createElement('span'); c.innerHTML=av(kids[i])+' '+esc(kids[i].name); c.style.animation='pop .4s cubic-bezier(.3,1.6,.5,1)'; mem.append(c);
    SFX.drum(); await sleep(500); alive(id); }
  SFX.ting(); await sleep(1100); alive(id);
  R.members=red.map(P); Bl.members=blue.map(P);
  const T=pickTeamTask();
  await explain(R,Bl,{i:T.i,t:T.t,how:['🔴 الأحمر ضد 🔵 الأزرق',T.do,TEAM_RULE[T.kind]]},id,{mult});
  setMusic('low'); arena(R,Bl,`<div class="icon">${T.i}</div><div class="say">${T.t}</div>`); sides({a:'on',b:'on'});
  await count321(id);
  let k;
  if(T.kind==='relay'){
    const need=Math.max(red.length,blue.length); const done={a:0,b:0};
    const a=$('.side.a'), b=$('.side.b');
    const mark=()=>{ for(const [el,key,team] of [[a,'a',red],[b,'b',blue]]){
      el.querySelectorAll('.members span').forEach((m,j)=>{ m.style.opacity = j<Math.min(done[key],team.length)||done[key]>=need?'.45':'1'; m.style.textDecoration=j<done[key]?'line-through':'none'; });
      let t=el.querySelector('.tally'); if(!t){ t=document.createElement('div'); t.className='tally'; el.append(t); }
      t.textContent='✅'.repeat(done[key])+'⬜'.repeat(need-done[key]); } };
    setMid(`<div class="icon">${T.i}</div><div class="say">يلا يلا!</div><div class="note">كل ما حدا يخلّص… اكبسوا على فريقه</div>${red.length!==blue.length?`<div class="note">الفريق الأصغر: أول واحد فيه بيرجع يلعب بالآخر</div>`:''}`);
    Beat.start(); mark(); [a,b].forEach(s=>{ s.classList.add('pick'); s.tabIndex=0; });
    k=await new Promise((res,rej)=>{
      const tap=key=>{ if(done[key]>=need) return; done[key]++; SFX.ting(); mark(); if(done[key]>=need) res(key); };
      a.onclick=()=>tap('a'); b.onclick=()=>tap('b');
      const iv=setInterval(()=>{ if(id!==run){ clearInterval(iv); rej(new Quit()); } else if(!document.body.contains(a)) clearInterval(iv); },200); });
    [a,b].forEach(s=>{ s.classList.remove('pick'); s.onclick=null; }); Beat.stop();
  } else if(T.kind==='fast'){
    setMid(`<div class="icon">${T.i}</div><div class="say">يلا يلا!</div>${timerHTML(15)}<div class="note">اكبسوا على أول فريق بيخلّص</div>`);
    const tp=countdownTimer(15,id,{});
    const a=$('.side.a'), b=$('.side.b'); [a,b].forEach(s=>{ s.classList.add('pick'); s.tabIndex=0; });
    k=await Promise.race([tp.then(()=>null), new Promise(res=>{ a.onclick=()=>res('a'); b.onclick=()=>res('b'); })]);
    [a,b].forEach(s=>{ s.classList.remove('pick'); s.onclick=null; });
    if(!k) k=await pickSide(id,{label:'مين خلّص أول؟'}); else Beat.stop();
  } else {
    const secs=T.kind==='loud'?6:12;
    setMid(`<div class="icon">${T.i}</div><div class="say">${T.kind==='loud'?'يلاااا! 📣':'يلا!'}</div>${timerHTML(secs)}<div class="controls" id="ctrl"></div>`);

    speak('مين ربح؟'); k=await pickSide(id,{label:T.kind==='loud'?'مين كان أعلى؟':'مين كان أحلى؟'});
  }
  const list=[];
  if(k==='tie') red.concat(blue).forEach(i=>list.push([i,2*mult]));
  else { const Wt=k==='a'?red:blue, Lt=k==='a'?blue:red; Wt.forEach(i=>{ list.push([i,2*mult]); kids[i].wins++; }); Lt.forEach(i=>list.push([i,1*mult])); }
  const Wteam=k==='a'?R:k==='b'?Bl:null;
  await result(k, R, Bl, id, {stars:list,
    headline: Wteam?`فريق ${Wteam.name} ربح!`:'تعادل! الفريقين أبطال!',
    note: Wteam?'الفائزين ⭐⭐ والفريق التاني ⭐':'كل واحد بياخد ⭐⭐'});
}

function endGame(id){
  Beat.stop(); if(id!==run) return;
  const order=kids.map((k,i)=>i).sort((a,b)=>kids[b].stars-kids[a].stars);
  const used=new Set(), titles={};
  order.forEach((i,rank)=>{
    if(rank===0){ titles[i]=TITLES[0]; used.add(TITLES[0]); return; }
    const won=Object.keys(kids[i].byDuel).map(d=>DUEL_TITLE[d]).filter(t=>t&&!used.has(t));
    const t=won[0]||shuffle(TITLES.slice(1)).find(x=>!used.has(x))||'🌟 بطل'; titles[i]=t; used.add(t);
  });
  const top=kids[order[0]].stars; const best=order.filter(i=>kids[i].stars===top).slice(0,3);
  $('#heroes').innerHTML=best.map((i,n)=>`<div class="hero-card" style="animation-delay:${n*.2}s"><div class="hero-pic" style="--c:${kids[i].c}"><span class="crown-top">👑</span>${av(kids[i])}</div><div class="hero-name">${esc(kids[i].name)}</div><div class="hero-sub">⭐ بطل اللعبة ⭐ ${toAr(kids[i].stars)}</div></div>`).join('');
  const c=$('#crowns'); c.innerHTML='';
  order.forEach((i,n)=>{ const k=kids[i]; const d=document.createElement('div'); d.className='crown'; d.style.animationDelay=(n*.15)+'s'; d.style.setProperty('--c',k.c);
    d.innerHTML=`<div class="c">👑</div><div class="em">${av(k)}</div><div class="nm">${esc(k.name)}</div><div class="ttl">${titles[i]}</div><div class="st">⭐ ${toAr(k.stars)}</div>`; c.append(d); });
  show('end'); confetti(80); SFX.fanfare(); setMusic('high');
  speak(`بطل اللعبة: ${best.map(i=>kids[i].name).join(' و ')}! وبرافو، كلكم أبطال!`);
}

/* ---------- Menu & controls ---------- */
function stopAll(){ run++; Beat.stop(); setMusic('off',true); try{ speechSynthesis.cancel(); }catch(e){} document.querySelectorAll('.confetti,.fly').forEach(e=>e.remove()); $('#screen').classList.remove('shake'); }
function closeMenu(){ $('#menu').hidden=true; $('#menuBtn').setAttribute('aria-expanded','false'); }
$('#menuBtn').onclick=e=>{ e.stopPropagation(); const m=$('#menu'); m.hidden=!m.hidden; $('#menuBtn').setAttribute('aria-expanded', String(!m.hidden)); };
document.addEventListener('click',e=>{ if(!$('#menu').hidden && !e.target.closest('#menu')) closeMenu(); });
$('#startBtn').onclick=startGame;
$('#againBtn').onclick=()=>{ startGame(); };
$('#editBtn').onclick=()=>{ stopAll(); renderSetup(); show('setup'); lobbyStart(); };
$('#quitBtn').onclick=()=>{ closeMenu(); stopAll(); renderSetup(); show('setup'); lobbyStart(); };
$('#skipBtn').onclick=async ()=>{ closeMenu(); if(!G) return; stopAll(); lobbyStop(); const id=run; try{ await loop(id); }catch(e){ if(!(e instanceof Quit)) console.error(e); } };
$('#muteBtn').onclick=()=>{ closeMenu(); muted=!muted; $('#muteBtn').textContent=muted?'🔊 شغّل الصوت':'🔇 كتم الصوت';
  if(muted){ try{ speechSynthesis.cancel(); }catch(e){} lobby.pause(); } else if(lobbyOn){ lobby.play().catch(()=>{}); } if(musicOK&&mLevel!=='off'){ if(!muted&&music.paused) music.play().catch(()=>{}); applyVol(true); } };
$('#fsBtn').onclick=()=>{ closeMenu(); try{ if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{}); else document.exitFullscreen().catch(()=>{}); }catch(e){} };

const st=load(); kids=st.kids; adults=st.adults||[];
renderSetup();
})();
</script>
